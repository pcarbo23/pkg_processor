[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg_processor"
version = "0.1.0"
description = "PICS Package Process tool to ingest compliant packages and convert to Z39.86-2002 compliant DTBs"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "lxml>=4.9.0",
]

[project.scripts]
pkg-processor = "pkg_processor.cli:main"
